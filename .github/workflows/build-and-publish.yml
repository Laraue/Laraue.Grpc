# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      id-token: write # enable GitHub OIDC token issuance, needed for NuGet trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test

    - name: Generate a NuGet package
      run: dotnet pack --no-build -c Release -o .

    - name: NuGet login (OIDC -> temp API key)
      if: github.ref == 'refs/heads/main'
      uses: NuGet/login@v1
      id: nuget-login
      with:
        # nuget.org username (profile name), NOT an email address - kept as a secret since it's
        # part of what nuget.org checks against the trusted publishing policy below.
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      if: github.ref == 'refs/heads/main'
      run: dotnet nuget push "*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
